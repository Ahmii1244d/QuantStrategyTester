services:
  - type: web
    name: quant-strategy-tester
    env: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python tester_app.py"
    envVars:
      - key: PORT
        value: "5000"
      - key: DATA_DIR
        # Render places the repo in /opt/render/project/src by default
        value: "/opt/render/project/src/data"
